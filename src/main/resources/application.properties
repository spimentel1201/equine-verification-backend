# ========================================
# HorseTrust - Application Configuration
# ========================================

spring.application.name=horsetrust-backend

# ---- Server ----
server.port=8080

# ---- Database Configuration ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/horsetrustdb}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:horsetrust_user}
spring.datasource.password=${DB_PASSWORD:horsetrust_pass}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# JWT
app.jwt.secret=${JWT_SECRET:Jm3e6hT2l3q7pYV3Z1c4wQm0lV4yQGf0n9Wv8y2Xo1E=}
app.jwt.issuer=${JWT_ISSUER:horsetrust}
app.jwt.access-hours=${JWT_ACCESS_HOURS:2}
app.jwt.refresh-hours=${JWT_REFRESH_HOURS:168}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---- SpringDoc / Swagger ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true